<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <title>OVC CaseFile</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3ead8; font-family: "Segoe UI", system-ui, sans-serif; color: #3f3a32; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; }
      .mark { width: 148px; height: 148px; border-radius: 28px; overflow: hidden; background: #f7f0e4; box-shadow: 0 12px 40px rgba(63,58,50,0.18); }
      .mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
      h1 { font-size: 22px; margin: 8px 0 0; font-weight: 600; letter-spacing: -0.02em; }
      .org { margin: 0; font-size: 13px; color: #7a7368; }
      #status { margin: 4px 0 0; font-size: 14px; color: #5c564c; min-height: 1.2em; }
      .bar { width: 200px; height: 5px; background: rgba(63,58,50,0.12); border-radius: 99px; overflow: hidden; }
      .fill { height: 100%; width: 38%; background: #3f3a32; border-radius: 99px; animation: load 1.15s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-90%); } 100% { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark"><img src="icons/icon-256.png" alt="" /></div>
      <h1>OVC CaseFile</h1>
      <p class="org">Sebueng Itumeleng</p>
      <p id="status">Opening the office file…</p>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </body>
</html>
