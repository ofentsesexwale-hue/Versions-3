<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ead8" />
    <meta name="description" content="Offline OVC case management" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <title>OVC CaseFile</title>
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (
            e.error instanceof DOMException &&
            e.error.name === "DataCloneError" &&
            e.message &&
            e.message.includes("PerformanceServerTiming")
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true,
      );
    </script>
  </head>
  <body style="margin:0;background:#f3ead8;color:#3f3a32;font-family:Segoe UI,system-ui,sans-serif">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box">
        <div style="width:148px;height:148px;border-radius:28px;overflow:hidden;background:#f7f0e4;box-shadow:0 12px 40px rgba(63,58,50,0.18)">
          <img src="%PUBLIC_URL%/emblem.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block" />
        </div>
        <h1 style="font-size:22px;margin:0;font-weight:600;letter-spacing:-0.02em">OVC CaseFile</h1>
        <p style="margin:0;font-size:13px;color:#7a7368">Sebueng Itumeleng</p>
        <p style="margin:0;font-size:14px;color:#5c564c">Opening the office file…</p>
        <div style="width:200px;height:5px;background:rgba(63,58,50,0.12);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:38%;background:#3f3a32;border-radius:99px;animation:ovcboot 1.15s ease-in-out infinite"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes ovcboot { 0% { transform: translateX(-90%); } 100% { transform: translateX(280%); } }
    </style>
  </body>
</html>
